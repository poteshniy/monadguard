name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run secrets
      - run: npm test
      # Cross-implementation vectors, pinned as files — never a live fetch, so a
      # red build here means the receipt format moved, not that a server is down.
      - run: node test/interop.test.mjs
